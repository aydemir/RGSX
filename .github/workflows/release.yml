# Native-only release pipeline (TASK-012-gap-02).
# Tetikleme: git tag v1.X.X && git push origin v1.X.X
#
# Paketler (isimler eski Python dönemiyle aynı kalır):
#   - RGSX_update_latest.zip          → /userdata/roms/ports/RGSX içine açılır
#     (manager-bin [Linux x86_64] + webui/ + RGSX.sh)
#   - RGSX_update_windows_latest.zip  → RetroBat roms köküne açılır
#     (ports/RGSX/manager-bin.exe + webui/ + windows/ launcher'ları)
#   - RGSX_full_latest.zip            → ports/ + windows/ tam paket
#
# Not: Linux binary ubuntu-22.04'te derlenir (eski glibc → Batocera/Knulli uyumu).
name: Release on tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # sdl2-sys bundled CMake projesi cmake_minimum_required(<3.5) istiyor;
  # runner'lardaki CMake 4.x policy hatasini asmak icin (TASK-015).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build_webui_linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build WebUI (Vue SPA)
        shell: bash
        run: |
          set -euo pipefail
          cd webui
          npm ci
          npm run build
          cd ..
          echo "✓ WebUI built"

      - name: Install SDL2 build dependencies (bundled sdl2-sys)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libgl1-mesa-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build manager-bin (Linux x86_64, release)
        shell: bash
        working-directory: manager-rs
        run: |
          set -euo pipefail
          cargo build --release -p manager-bin
          echo "✓ manager-bin built"

      - name: Stage Linux layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/RGSX/webui
          cp manager-rs/target/release/manager-bin stage/RGSX/manager-bin
          cp -r webui/dist/. stage/RGSX/webui/
          chmod +x stage/RGSX/manager-bin

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgsx-linux
          path: stage/
          retention-days: 3

      - name: Upload WebUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgsx-webui
          path: webui/dist/
          retention-days: 3

  build_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build manager-bin.exe (Windows x86_64 MSVC, release)
        shell: pwsh
        working-directory: manager-rs
        run: |
          cargo build --release -p manager-bin
          echo "✓ manager-bin.exe built"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgsx-windows
          path: manager-rs/target/release/manager-bin.exe
          retention-days: 3

  create_release:
    needs: [build_webui_linux, build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Build RGSX Release Packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist

          # --- RGSX_update_latest.zip: Batocera/Knulli (/userdata/roms/ports/RGSX) ---
          cd artifacts/rgsx-linux/RGSX
          zip -r "../../../dist/RGSX_update_latest.zip" .
          cd ../../..

          # --- RGSX_update_windows_latest.zip: RetroBat (roms köküne açılır) ---
          mkdir -p winpkg/ports/RGSX/webui
          cp artifacts/rgsx-windows/manager-bin.exe winpkg/ports/RGSX/
          cp -r artifacts/rgsx-webui/. winpkg/ports/RGSX/webui/
          cp -r windows winpkg/windows
          cd winpkg
          zip -r "../dist/RGSX_update_windows_latest.zip" .
          cd ..

          # --- RGSX_full_latest.zip: ports/ + windows/ tam paket ---
          mkdir -p fullpkg/ports/RGSX/webui
          cp -r ports/. fullpkg/ports/
          cp -r artifacts/rgsx-linux/RGSX/. fullpkg/ports/RGSX/
          cp artifacts/rgsx-windows/manager-bin.exe fullpkg/ports/RGSX/
          cp -r artifacts/rgsx-webui/. fullpkg/ports/RGSX/webui/
          cp -r windows fullpkg/windows
          cd fullpkg
          zip -r "../dist/RGSX_full_latest.zip" .
          cd ..

          echo "✓ All packages created successfully"
          ls -lh dist/

      - name: Generate release notes with commit message
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --format=%B ${{ github.ref_name }})
          echo "Commit message:"
          echo "$COMMIT_MSG"

          cat > dist/RELEASE_NOTES.md << 'RELEASE_EOF'
          # 📦 RGSX Release ${{ github.ref_name }}

          ## 📝 Changelog
          RELEASE_EOF

          echo "$COMMIT_MSG" >> dist/RELEASE_NOTES.md

          cat >> dist/RELEASE_NOTES.md << 'RELEASE_EOF'

          ---

          ## 📥 Automatic Installation (Only for Batocera/Knulli)

          ### ON PC, NUC, SteamDeck or any x86_64 based:
          1. Open File Manager (F1) then "Applications" and launch xterm
          2. Use the command line `curl -L bit.ly/rgsx-install | sh`
          3. Launch RGSX from "Ports" menu

          ### ON RASPBERRY/ ARM based SBC / HANDHELD :
          1. Connect your device with SSH on a computer/smartphone connected to same network (ssh root@IPADDRESS , pass:linux)
          2. Use the command line `curl -L bit.ly/rgsx-install | sh`
          3. Launch RGSX from "Ports" menu

          ## 📥 Manual Installation

          ### Batocera/Knulli
          1. Download latest release : https://github.com/RetroGameSets/RGSX/releases/latest/download/RGSX_full_latest.zip
          2. Extract only PORTS folder in `/userdata/roms/`
          3. Launch RGSX from the Ports menu

          ### Retrobat/Full Installation on Windows
          1. Download latest release : https://github.com/RetroGameSets/RGSX/releases/latest/download/RGSX_full_latest.zip
          2. Extract all folders in your Retrobat\roms folder
          3. Launch RGSX from system "Windows"


          ## 📥 Manual Update (only if automatic doesn't work for some obscure reason)

          #### Batocera/Knulli
          1. Download latest update : https://github.com/RetroGameSets/RGSX/releases/latest/download/RGSX_update_latest.zip
          2. Extract zip content in `/userdata/roms/ports/RGSX`
          3. Launch RGSX

          #### Retrobat
          1. Download latest RGSX update : https://github.com/RetroGameSets/RGSX/releases/latest/download/RGSX_update_windows_latest.zip
          2. Extract zip content in `retrobat\roms\`
          3. Launch RGSX from system "Windows"

          ### 📖 Documentation
          [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)

          ## SUPPORT US
          Donate , Buy me a beer or a coffee :
          if you want to support my project you can look here 🙂 https://bit.ly/donate-to-rgsx

          Affiliate links :
          hi all if you want to buy a premium account, you can use affiliated links here to support dev of RGSX without donate anything :
          DEBRID-LINK.FR : https://debrid-link.fr/id/ow1DD
          1FICHIER.COM : https://1fichier.com/?af=3186111
          REAL-DEBRID.FR : http://real-debrid.com/?id=8441
          RELEASE_EOF

          echo "✓ Release notes generated"
          cat dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RGSX ${{ github.ref_name }}
          generate_release_notes: false
          draft: false
          prerelease: false
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/RGSX_update_latest.zip
            dist/RGSX_update_windows_latest.zip
            dist/RGSX_full_latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send changelog to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK secret tanimli degil — Discord bildirimi atlandi"
            exit 0
          fi

          CHANGELOG=$(git log -1 --format=%B "${{ github.ref_name }}")

          PAYLOAD=$(jq -n \
            --arg version "${{ github.ref_name }}" \
            --arg changelog "$CHANGELOG" \
            '{
              username: "RGSX Releases Bot",
              avatar_url: "https://retrogamesets.fr/assets/images/avatar.png",
              content: ("📦 **RGSX " + $version + "**\n\n📝 **Changelog :**\n" + $changelog)
            }')

          curl --fail-with-body -H "Content-Type: application/json" \
          -X POST \
          --data "$PAYLOAD" \
          "$DISCORD_WEBHOOK_URL"
