[package]
name = "manager-tvui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TVUI native shell — rust-sdl2 ile 10-foot native render (Faz 12b, yön B)"

# Yön (B): `display/*`+`controls/*` (pygame native) SDL2 primitives'e birebir portlanır;
# temalar `theme.json` (`colors.py`+`fonts.py`+`transitions.py`+`icons.py`) serde_json ile
# yüklenir (ES `theme.xml` yerine). `RGSX_TVUI=1` → SDL2 native shell (tek TVUI yolu;
# Python fallback TASK-012-gap-02 ile söküldü).

[dependencies]
manager-http = { path = "../manager-http" }
manager-core = { path = "../manager-core" }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sdl2 = { version = "0.37", default-features = false, features = ["bundled"] }
# Faz 2c: TVUI SSE istemcisi (senkron, tokio'suz — SDL2 döngüsü bloklayıcı).
ureq = "2"

# TASK-005-B — native SDL2/gilrs gamepad girdi yolu (yalnız `native-input` feature
# ile gelir; böylece libudev gerektiren gilrs varsayılan Linux sandbox build'ini
# kırmaz, yalnız Windows native / uygun makinede etkinleşir).
[dependencies.gilrs]
version = "0.11"
optional = true

[features]
# Native gamepad: gilrs tabanlı SDL code okuyucu + ES map sadakati.
native-input = ["gilrs"]
