[workspace]
resolver = "2"
members = [
    "manager-core",
    "manager-http",
    "manager-windows",
    "manager-bridge",
    "manager-bin",
    "manager-torrent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
percent-encoding = "2"
manager-core = { path = "manager-core" }
manager-http = { path = "manager-http" }
manager-bridge = { path = "manager-bridge" }
manager-torrent = { path = "manager-torrent" }