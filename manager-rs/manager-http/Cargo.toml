[package]
name = "manager-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP + SSE route'ları (tokio + axum)"

[dependencies]
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
tracing.workspace = true
tower-http = { version = "0.6", features = ["fs"] }
manager-core.workspace = true
manager-bridge.workspace = true
manager-scan = { path = "../manager-scan" }
manager-download = { path = "../manager-download" }
reqwest.workspace = true
percent-encoding.workspace = true
async-trait.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait.workspace = true
manager-torrent = { path = "../manager-torrent" }
tempfile = "3"