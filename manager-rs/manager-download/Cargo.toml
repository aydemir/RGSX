[package]
name = "manager-download"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Faz 12e — indirme resolver soyutlaması: DDL/debrid (1Fichier/RealDebrid) çözümü + doğrudan HTTP torrent sınıflandırması (Python one_fichier.py/utils_torrent.py portu)"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
percent-encoding = "2"
bytes = "1"
regex.workspace = true
url.workspace = true

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["http1"] }
http-body = "1"
http-body-util = "0.1"
